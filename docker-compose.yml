services:

  php:
    build: .
    container_name: slim-api
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: slimdb
      DB_USERNAME: slimuser
      DB_PASSWORD: password

  mysql:
    image: mysql:8.4
    container_name: slim-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: